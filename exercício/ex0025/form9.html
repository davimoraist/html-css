 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Meu primeiro formulário</h1>
    <form action="login.php" method="post" autocomplete="off" onreset="ival.innerHTML = inu.value">
        <p>
            <label for="inu">Número</label>
            <input type="range" name="inu" id="inu" min="0" max="10" value="5"
             oninput="ival.innerHTML = Number(inu.value)">
            <output id="ival">5</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
