 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Meu primeiro formulário</h1>
    <form action="login.php" method="post" autocomplete="off" onreset="ival.innerHTML = inu.value">
         <p>
            <label for="ano">Qual ano você nasceu</label>
            <input type="number" name="ano" id="ano" min="1900" max="2026" 
            oninput="calidade()">
         </p>
         <p>
            <label for="idade">idade</label>
            <output id="idade">0</output>
         </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    <script>
        function calidade(){
            var atual = new Date().getFullYear()
            idade.innerHTML = Number(atual) - Number(ano.value)
        }
    </script>
</body>
</html>
